<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5fd4" />
    <title>KP App — Katarungang Pambarangay</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      setTimeout(function () {
        if (window.__kpBooted || !navigator.onLine) return
        try {
          if (sessionStorage.getItem('kp-recovered')) return
          sessionStorage.setItem('kp-recovered', '1')
        } catch (e) {}
        var jobs = []
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }))
        }
        Promise.all(jobs).finally(function () { location.reload() })
      }, 6000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
