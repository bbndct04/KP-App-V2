<div style="background:#f1f5f9;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden">
    <div style="background:#1e3a8a;color:#ffffff;padding:18px 24px">
      <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Barangay New Kababae · Olongapo City</div>
      <div style="font-size:18px;font-weight:bold;margin-top:2px">KP App</div>
    </div>
    <div style="padding:24px;text-align:center">
      <p style="margin:0 0 6px;font-size:15px">Your verification code is</p>
      <div style="font-size:34px;font-weight:bold;letter-spacing:8px;color:#1e3a8a;background:#eef2ff;border-radius:10px;padding:14px 0;margin:10px 0 16px">{{ .Token }}</div>
      <p style="margin:0;font-size:14px;color:#475569;line-height:1.6">Enter this code in the KP App to confirm your email.<br>It expires in 15 minutes.</p>
    </div>
    <div style="padding:14px 24px;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;line-height:1.5">
      If you did not create a KP App account, you can ignore this email. Never share this code with anyone, including barangay staff.
    </div>
  </div>
</div>
