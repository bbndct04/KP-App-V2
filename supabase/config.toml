
[functions.verify-id]
enabled = true
verify_jwt = true
import_map = "./functions/verify-id/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/verify-id/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/verify-id/*.html" ]

[functions.invite-official]
enabled = true
verify_jwt = true
import_map = "./functions/invite-official/deno.json"
entrypoint = "./functions/invite-official/index.ts"
